name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Smoke Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 6 للمشروع + SDK 7 لتشغيل أداة dotnet-ef 7.x
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --verbosity minimal

      # توليد ملفات EF Migrations عند عدم وجودها (مرة واحدة فقط)
      # ثم رفعها إلى نفس الفرع — تُنفَّذ قبل الفحص التشغيلي حتى تُختبر فوراً.
      - name: Generate EF migrations (first time only)
        shell: pwsh
        run: |
          function Show-Failure([string]$Path) {
            Get-Content $Path -ErrorAction SilentlyContinue | Select-Object -Last 10 |
              ForEach-Object { Write-Output ("::error::" + ($_ -replace "`t", " ")) }
            exit 1
          }

          if (Test-Path "Data/Migrations") {
            Write-Host "Migrations already exist - skipping generation."
            exit 0
          }

          $log = Join-Path $env:RUNNER_TEMP "ef-log.txt"

          dotnet tool install --global dotnet-ef --version 7.0.20 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { Show-Failure $log }

          Write-Host "=== Attempt 1: dotnet ef (project as-is) ==="
          dotnet ef migrations add InitialCreate --output-dir Data/Migrations --verbose 2>&1 | Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== Attempt 2: retry with temporary AnyCPU ==="
            Write-Host "(dotnet-ef runs as a 64-bit process and cannot load x86-flagged assemblies;"
            Write-Host " PlatformTarget does not affect the generated migration content)"

            $csproj = "MizanPro.csproj"
            $original = Get-Content $csproj -Raw
            $original.Replace("<PlatformTarget>x86</PlatformTarget>", "<PlatformTarget>AnyCPU</PlatformTarget>") | Set-Content $csproj

            try {
              dotnet ef migrations add InitialCreate --output-dir Data/Migrations 2>&1 | Tee-Object -FilePath $log
            }
            finally {
              # إرجاع الملف الأصلي مهما حدث
              Set-Content -Path $csproj -Value $original -NoNewline
            }

            if ($LASTEXITCODE -ne 0) { Show-Failure $log }
          }

          if (-Not (Test-Path "Data/Migrations")) { Show-Failure $log }

          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add Data/Migrations
          git commit -m "Add InitialCreate EF migration (generated by dotnet-ef)"
          git push 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { Show-Failure $log }

      # فحص تشغيلي فعلي: يشغّل قاعدة البيانات + الـ Migrations + الـ Seeder
      # وجميع الخدمات ومحرك التفعيل في مشروع مؤقت خارج المستودع.
      - name: Smoke test (runtime verification)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $smokeDir = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item ".github/smoke/*" -Destination $smokeDir -Recurse -Force

          # مسح مخرجات البناء السابقة (x86) حتى تُعاد ترجمة MizanPro بمعمارية AnyCPU
          Remove-Item -Recurse -Force "bin", "obj" -ErrorAction SilentlyContinue

          $csproj = Join-Path $smokeDir "Smoke.csproj"
          $mainProject = Join-Path $env:GITHUB_WORKSPACE "MizanPro.csproj"
          (Get-Content $csproj -Raw).Replace("__MAIN_PROJECT__", $mainProject) | Set-Content $csproj

          $output = Join-Path $env:RUNNER_TEMP "smoke-output.txt"

          # ملاحظة معمارية: مشروع ميزان بُني x86 في خطوة البناء أعلاه (كما في المواصفة)،
          # لكن عدّاء GitHub Actions لا يملك وقت تشغيل 32-بت، لذا يُبنى مشروع الفحص
          # (والمشروع المُشار إليه) بخصيصة AnyCPU العمومية — وهذا لا يغيّر أي منطق مُختبَر.
          dotnet build $csproj -c Debug -p:PlatformTarget=AnyCPU --verbosity minimal --nologo 2>&1 |
            Tee-Object -FilePath $output
          if ($LASTEXITCODE -ne 0) {
            Get-Content $output | Select-Object -Last 10 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace "`t", " "))
            }
            exit 1
          }

          $smokeDll = Join-Path $smokeDir "bin\Debug\net6.0-windows\MizanPro.SmokeTest.dll"
          dotnet $smokeDll 2>&1 | Tee-Object -FilePath $output
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            # إظهار نتائج الفحص كتعليقات داخل الـ Check Run لسهولة التشخيص
            $important = Get-Content $output |
              Where-Object { $_ -match "\[OK\]|\[FAIL\]|===|>>>|Exception|Unhandled|no such table|at MizanPro" }
            if (-Not $important) { $important = Get-Content $output | Select-Object -Last 12 }
            $important | Select-Object -Last 10 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace "`t", " "))
            }
            exit 1
          }

      # النشر الفعلي كما في build.bat: ملف واحد مكتفٍ ذاتياً (win-x86)
      - name: Publish single-file package (Release · win-x86)
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x86 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./dist

          $exe = "dist/MizanPro.exe"
          if (-Not (Test-Path $exe)) {
            Write-Output "::error::dist/MizanPro.exe was not produced"
            exit 1
          }

          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "MizanPro.exe produced successfully ($size MB)"

      # رفع الملف التنفيذي كـ Artifact يمكن تنزيله من صفحة التشغيل
      - name: Upload MizanPro.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizanPro-win-x86
          path: dist/MizanPro.exe
          retention-days: 14

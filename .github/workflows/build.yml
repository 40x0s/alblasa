name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Smoke Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --verbosity minimal

      # توليد ملفات EF Migrations عند عدم وجودها (مرة واحدة فقط)
      # ثم رفعها إلى نفس الفرع — تُنفَّذ قبل الفحص التشغيلي حتى تُختبر فوراً.
      - name: Generate EF migrations (first time only)
        shell: pwsh
        run: |
          if (-Not (Test-Path "Data/Migrations")) {
            dotnet tool install --global dotnet-ef --version 7.0.20
            dotnet ef migrations add InitialCreate --output-dir Data/Migrations

            git config user.name "arena-agent"
            git config user.email "arena-agent@users.noreply.github.com"
            git add Data/Migrations
            git commit -m "Add InitialCreate EF migration (generated by dotnet-ef)"
            git push
          } else {
            Write-Host "Migrations already exist - skipping generation."
          }

      # فحص تشغيلي فعلي: يشغّل قاعدة البيانات + الـ Migrations + الـ Seeder
      # وجميع الخدمات ومحرك التفعيل في مشروع مؤقت خارج المستودع.
      - name: Smoke test (runtime verification)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $smokeDir = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item ".github/smoke/*" -Destination $smokeDir -Recurse -Force

          $csproj = Join-Path $smokeDir "Smoke.csproj"
          $mainProject = Join-Path $env:GITHUB_WORKSPACE "MizanPro.csproj"
          (Get-Content $csproj -Raw).Replace("__MAIN_PROJECT__", $mainProject) | Set-Content $csproj

          $output = Join-Path $env:RUNNER_TEMP "smoke-output.txt"
          dotnet run --project $csproj --verbosity minimal 2>&1 | Tee-Object -FilePath $output

          if ($LASTEXITCODE -ne 0) {
            # إظهار مخرجات الفحص كتعليقات داخل الـ Check Run لسهولة التشخيص
            Get-Content $output | Select-Object -First 60 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace "`t", " "))
            }
            exit 1
          }

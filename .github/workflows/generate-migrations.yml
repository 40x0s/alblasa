name: Generate EF Migrations

# يشغَّل يدوياً (workflow_dispatch) لتوليد ملفات الـ Migrations عبر dotnet-ef
# ثم يرفعها تلقائياً إلى نفس الفرع.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: dotnet ef migrations add InitialCreate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Install dotnet-ef 7
        run: dotnet tool install --global dotnet-ef --version 7.0.20

      - name: Add InitialCreate migration
        run: dotnet ef migrations add InitialCreate --output-dir Data/Migrations

      - name: Commit and push generated files
        shell: pwsh
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add Data/Migrations
          if (git status --porcelain) {
            git commit -m "Add InitialCreate EF migration (generated by dotnet-ef)"
            git push
          } else {
            Write-Host "No new migration files to commit."
          }
